[package]
name = "semantix"
version = "0.1.0"
edition = "2021"
authors = ["VLDB 2026 NOVAS Workshop Contributors"]
description = "Learned Semantic Cost Models for LLM-Native Relational Engines"
license = "Apache-2.0"
repository = "https://github.com/novas-workshop-2026/learned-semantic-costs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = "0.19"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlparser = "0.45"
regex = "1.10"
lazy_static = "1.4"
ndarray = "0.15"
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }
ndarray-stats = "0.5"
statrs = "0.16"
xgboost = "0.4"
tch = { version = "0.14", optional = true }
rand = "0.8"
rayon = "1.8"
dashmap = "5.5"
parking_lot = "0.12"
bytes = "1.5"
futures = "0.3"
async-trait = "0.1"
http = "1.0"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
blake3 = "1.5"
toml = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[dev-dependencies]
tempfile = "3.8"
mockall = "0.12"
proptest = "1.4"

[[bin]]
name = "semantix-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "cost-profiler"
path = "src/bin/profiler.rs"

[[bin]]
name = "data-generator"
path = "src/bin/data_gen.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[lib]
name = "semantix"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
