version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: semantix-postgres
    environment:
      POSTGRES_DB: semantix
      POSTGRES_USER: semantix
      POSTGRES_PASSWORD: semantix123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semantix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - semantix-network

  # SEMANTIX Optimizer Service
  semantix:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: semantix-optimizer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://semantix:semantix123@postgres:5432/semantix"
      LOG_LEVEL: "info"
      RUST_LOG: "semantix=debug"
    volumes:
      - ./semantix.toml:/app/semantix.toml:ro
      - semantix_cache:/app/.cache
    ports:
      - "8080:8080"
    networks:
      - semantix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: pgAdmin for database inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: semantix-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@semantix.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - semantix-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  semantix_cache:
    driver: local

networks:
  semantix-network:
    driver: bridge
