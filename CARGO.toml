[package]
name = "semantix"
version = "0.1.0"
edition = "2026"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "semantix"
path = "src/main.rs"

[lib]
name = "semantix"
path = "src/lib.rs"
